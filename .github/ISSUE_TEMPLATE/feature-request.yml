name: Feature Request
description: Propose a new feature or enhancement for one of the PowerShell scripts or modules.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Request Type
      description: What kind of feature are you proposing? If unsure, select "Other" and provide details in the description.
      options:
        - New Subagent
        - New Skill
        - New Prompt
        - Other
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What pain point or gap currently exists?
      placeholder: "As a user, I want to be able to... but currently I have to... which is inefficient because..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Problem Scope
      description: What is the scope of the problem domain? Should the new feature be implemented as a standalone module, or integrated into an existing one? What are the key components or parameters of the proposed solution?
      placeholder: |
        - A subagent that can analyze PowerShell scripts and provide summaries of their functionality.
        - The subagent should be able to identify key functions, parameters, and overall purpose of the scripts.
        - It should be implemented as a new module that can be easily integrated into existing agents.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, related issues, external references, or any other relevant context.
